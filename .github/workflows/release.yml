name: Release Debian package (experimental)
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build-deb:
    # Keep the executable compatible with the declared Ubuntu 22.04 baseline.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action commit
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "dich-cli"))')"
          test "$tag_version" = "$package_version"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - run: cargo build --locked --release -p dich-cli --bin dich
      - run: cargo run --locked --release -p dich-cli --bin dich-gen-docs -- packaging/generated
      - run: cargo install cargo-deb --version 3.8.0 --locked
      - run: cargo deb -p dich-cli --no-build
      - name: Generate dependency SBOM
        run: |
          mkdir -p dist
          cargo install cargo-sbom --version 0.10.0 --locked
          python3 scripts/generate-release-sbom.py dist/dich.spdx.json
          python3 -c 'import json; d=json.load(open("dist/dich.spdx.json")); ids={p["SPDXID"] for p in d["packages"]}; allowed=ids|{d["SPDXID"]}; assert d["spdxVersion"] == "SPDX-2.3"; assert any(p["name"] == "dich-engine" for p in d["packages"]); assert len(d["packages"]) > 50; assert any(r["relationshipType"] == "DESCRIBES" and r["relatedSpdxElement"] in ids for r in d["relationships"]); assert all(r["spdxElementId"] in allowed and r["relatedSpdxElement"] in allowed for r in d["relationships"])'
      - name: Inspect and smoke test .deb
        run: |
          set -eu
          deb="$(find target/debian -maxdepth 1 -name '*.deb' | head -n 1)"
          test -n "$deb"
          dpkg-deb --contents "$deb" | grep -F '/usr/bin/dich'
          dpkg-deb --contents "$deb" | grep -F '/usr/share/man/man1/dich.1.gz'
          dpkg-deb --contents "$deb" | grep -F '/usr/share/man/ru/man1/dich.1.gz'
          dpkg-deb --contents "$deb" | grep -F '/usr/share/bash-completion/completions/dich'
          dpkg-deb --contents "$deb" | grep -F '/usr/share/zsh/vendor-completions/_dich'
          dpkg-deb --contents "$deb" | grep -F '/usr/share/fish/vendor_completions.d/dich.fish'
          dpkg-deb --contents "$deb" | grep -F '/usr/share/doc/dich/licenses/CDLA-Permissive-2.0.txt'
          # Pin every declared amd64 distro manifest; slim images exclude manpages by default.
          for image in \
            debian@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3 \
            debian@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4 \
            ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 \
            ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852; do
            docker run --rm --platform linux/amd64 -v "$PWD:/work:ro" -e DICH_DEB="/work/${deb#./}" "$image" sh -c '
              set -eu
              printf "path-include /usr/share/man/man1/dich*.1.gz\npath-include /usr/share/doc/dich/licenses/*\n" > /etc/dpkg/dpkg.cfg.d/zz-dich-smoke
              apt-get update -qq
              apt-get install -y -qq "$DICH_DEB"
              dich --help
              for asset in \
                /usr/share/man/man1/dich.1.gz \
                /usr/share/man/ru/man1/dich.1.gz \
                /usr/share/bash-completion/completions/dich \
                /usr/share/zsh/vendor-completions/_dich \
                /usr/share/fish/vendor_completions.d/dich.fish \
                /usr/share/doc/dich/licenses/CDLA-Permissive-2.0.txt; do
                test -f "$asset" || { echo "Missing installed package asset: $asset"; dpkg-query -L dich; exit 1; }
              done
              apt-get install --reinstall -y -qq "$DICH_DEB"
              dich --version
              apt-get remove -y -qq dich
              test ! -e /usr/bin/dich
            '
          done
      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cd dist
          sha256sum *.deb *.spdx.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: 'dist/*.deb'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dich-deb-amd64
          path: dist/*
      - uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: true
