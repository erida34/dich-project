name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action commit
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo doc --locked --workspace --no-deps
      - uses: EmbarkStudios/cargo-deny-action@8371184b9282b7df336cc688f9181df27330c8e9 # v2.0.11
        with:
          command: check
      - uses: rustsec/audit-check@2569c7636e090a9cf1ee9ad663e6fa6e77a2dd44 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: sh scripts/check-docs.sh
      - run: cargo run --locked -p dich-cli -- --help

  deb-package-smoke:
    # Build against the oldest declared glibc baseline (Ubuntu 22.04 / 2.35).
    # Building on newer runners can raise cargo-deb's inferred libc6 minimum.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action commit
        with:
          toolchain: stable
      - run: cargo build --locked --release -p dich-cli --bin dich
      - run: cargo run --locked --release -p dich-cli --bin dich-gen-docs -- packaging/generated
      - run: cargo install cargo-deb --version 3.8.0 --locked
      - run: cargo deb -p dich-cli --no-build
      - name: Verify package and smoke test install/upgrade/remove in clean target images
        run: |
          set -eu
          deb="$(find target/debian -maxdepth 1 -name '*.deb' | head -n 1)"
          test -n "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -F '/usr/bin/dich'
          dpkg-deb --contents "$deb" | grep -F '/usr/share/man/man1/dich.1.gz'
          dpkg-deb --contents "$deb" | grep -F '/usr/share/bash-completion/completions/dich'
          dpkg-deb --contents "$deb" | grep -F '/usr/share/zsh/vendor-completions/_dich'
          dpkg-deb --contents "$deb" | grep -F '/usr/share/fish/vendor_completions.d/dich.fish'
          dpkg-deb --contents "$deb" | grep -F '/usr/share/doc/dich/licenses/CDLA-Permissive-2.0.txt'

          # Smoke test install, upgrade, and removal across target distributions
          for image in debian:bookworm-slim debian:trixie-slim ubuntu:22.04 ubuntu:24.04; do
            echo "=== Smoke testing in $image ==="
            docker run --rm -v "$PWD:/work:ro" "$image" sh -c '
              set -eu
              printf "path-include /usr/share/man/man1/dich*.1.gz\n" > /etc/dpkg/dpkg.cfg.d/zz-dich-smoke
              apt-get update -qq
              apt-get install -y -qq /work/'"$deb"'
              /usr/bin/dich --help
              test -f /usr/share/man/man1/dich.1.gz
              test -f /usr/share/bash-completion/completions/dich
              test -f /usr/share/zsh/vendor-completions/_dich
              test -f /usr/share/fish/vendor_completions.d/dich.fish
              test -f /usr/share/doc/dich/licenses/CDLA-Permissive-2.0.txt
              # Upgrade/reinstall test
              apt-get install --reinstall -y -qq /work/'"$deb"'
              /usr/bin/dich --version
              # Removal test
              apt-get remove -y -qq dich
              test ! -f /usr/bin/dich
            '
          done
