[package]
name = "dich-cli"
default-run = "dich"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Dich versioned package store CLI for authenticated Debian and Ubuntu DSO profiles"
readme = "../../README.md"

[lib]
name = "dich_cli"
path = "src/lib.rs"

[[bin]]
name = "dich"
path = "src/main.rs"

[[bin]]
name = "dich-gen-docs"
path = "src/bin/gen_docs.rs"

[[bench]]
name = "performance_benchmarks"
harness = false

[dependencies]
clap.workspace = true
clap_mangen.workspace = true
clap_complete.workspace = true
dich-apt = { path = "../dich-apt" }
dich-core = { path = "../dich-core" }
dich-store = { path = "../dich-store" }
dich-deb = { path = "../dich-deb" }
dich-engine = { path = "../dich-engine" }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
ar = "=0.9.0"
tar = { version = "=0.4.45", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }

[package.metadata.deb]
name = "dich"
maintainer = "Dich Maintainers"
section = "admin"
priority = "optional"
depends = "$auto, gpgv, util-linux, gzip, xz-utils, zstd"
extended-description = "Experimental versioned package store using verified Debian/Ubuntu APT repositories. Profile installation is restricted to authenticated x86-64 glibc shared-object closures; package code is not executed and host loader state is not modified."
assets = [
  ["target/release/dich", "usr/bin/", "755"],
  ["../../packaging/generated/man/*.1", "usr/share/man/man1/", "644"],
  ["../../packaging/generated/completions/dich.bash", "usr/share/bash-completion/completions/dich", "644"],
  ["../../packaging/generated/completions/_dich", "usr/share/zsh/vendor-completions/", "644"],
  ["../../packaging/generated/completions/dich.fish", "usr/share/fish/vendor_completions.d/", "644"],
  ["../../README.md", "usr/share/doc/dich/README.md", "644"],
  ["../../LICENSE-MIT", "usr/share/doc/dich/LICENSE-MIT", "644"],
  ["../../LICENSE-APACHE", "usr/share/doc/dich/LICENSE-APACHE", "644"],
  ["../../packaging/licenses/CDLA-Permissive-2.0.txt", "usr/share/doc/dich/licenses/CDLA-Permissive-2.0.txt", "644"],
]
