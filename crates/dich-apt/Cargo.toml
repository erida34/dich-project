[package]
name = "dich-apt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
